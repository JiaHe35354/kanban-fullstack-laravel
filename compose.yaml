services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev

        working_dir: /var/www/html

        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules

        ports:
            - '8000:8000'
            - '5173:5173'

        env_file:
            - .env

        command: sh -c "npm ci && (php artisan serve --host=0.0.0.0 --port=8000 & npm run dev -- --host=0.0.0.0)"

volumes:
    vendor:
    node_modules:
