services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.dev

        working_dir: /var/www/html

        volumes:
            - .:/var/www/html
            - vendor:/var/www/html/vendor
            - node_modules:/var/www/html/node_modules

        ports:
            - '8000:8000'
            - '5173:5173'

        env_file:
            - .env

        depends_on:
            - db

        command: sh -c "npm ci && (php artisan serve --host=0.0.0.0 --port=8000 & npm run dev -- --host=0.0.0.0)"

    db:
        image: postgres:17

        environment:
            POSTGRES_DB: kanban
            POSTGRES_USER: kanban
            POSTGRES_PASSWORD: password

        volumes:
            - postgres_data:/var/lib/postgresql/data

        ports:
            - '5432:5432'

volumes:
    vendor:
    node_modules:
    postgres_data:
